<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page to Doc</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
      color: #1f2328;
      width: 280px;
      padding: 20px 18px 18px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .header svg {
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .header p {
      font-size: 11px;
      color: #57606a;
      margin-top: 1px;
    }

    .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin-bottom: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 14px;
      border: none;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      margin-bottom: 8px;
    }

    .btn:last-child { margin-bottom: 0; }

    .btn-docx {
      background: #2563eb;
      color: #fff;
    }
    .btn-docx:hover { background: #1d4ed8; }

    .btn-pdf {
      background: #16a34a;
      color: #fff;
    }
    .btn-pdf:hover { background: #15803d; }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #57606a;
      text-align: center;
      min-height: 16px;
    }

    #status.error { color: #dc2626; }
    #status.success { color: #16a34a; }
  </style>
</head>
<body>
  <div class="header">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="26" height="26" rx="6" fill="#2563eb"/>
      <path d="M7 7h7.5L19 11.5V19H7V7z" fill="#fff" fill-opacity="0.15" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M14.5 7v4.5H19" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10 14h6M10 17h4" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>Page to Doc</h1>
      <p>Clean content export</p>
    </div>
  </div>
  <hr class="divider" />
  <button class="btn btn-docx" id="btnDocx">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 2.5A.5.5 0 012.5 2h6.293a.5.5 0 01.353.146l3.708 3.708A.5.5 0 0113 6.207V12.5a.5.5 0 01-.5.5h-10A.5.5 0 012 12.5v-10z" stroke="#fff" stroke-width="1.2"/><path d="M8.5 2.5v3.5H12" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>
    Download DOCX
  </button>
  <button class="btn btn-pdf" id="btnPdf">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M2 2.5A.5.5 0 012.5 2h6.293a.5.5 0 01.353.146l3.708 3.708A.5.5 0 0113 6.207V12.5a.5.5 0 01-.5.5h-10A.5.5 0 012 12.5v-10z" stroke="#fff" stroke-width="1.2"/><path d="M8.5 2.5v3.5H12" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/><path d="M5 9h5M5 11h3" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/></svg>
    Download PDF
  </button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
