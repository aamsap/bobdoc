<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bobdoc</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      width: 300px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      flex-shrink: 0;
      display: block;
    }

    .header-text h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1;
    }

    .header-text p {
      font-size: 11px;
      color: #666;
      margin-top: 3px;
      line-height: 1.3;
    }

    /* ── Body ── */
    .body {
      padding: 14px 16px 16px;
    }

    /* ── Buttons ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      margin-bottom: 8px;
      letter-spacing: -0.1px;
    }

    .btn:last-of-type { margin-bottom: 0; }

    .btn-docx {
      background: #2563eb;
      color: #fff;
    }

    .btn-pdf {
      background: #16a34a;
      color: #fff;
    }

    .btn:hover:not(:disabled) { filter: brightness(1.1); }
    .btn:active:not(:disabled) { transform: scale(0.98); }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Status ── */
    #status {
      margin-top: 10px;
      font-size: 11.5px;
      color: #666;
      text-align: center;
      min-height: 15px;
      line-height: 1.4;
    }

    #status.error   { color: #f87171; }
    #status.success { color: #4ade80; }

    /* ── Footer ── */
    .footer {
      padding: 9px 16px 11px;
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-hint {
      font-size: 10.5px;
      color: #444;
    }

    .footer-link {
      font-size: 10.5px;
      color: #555;
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-link:hover { color: #888; }
  </style>
</head>
<body>

  <div class="header">
    <img src="icons/icon48.png" class="logo" alt="Bobdoc" />
    <div class="header-text">
      <h1>Bobdoc</h1>
      <p>Save this page as a clean DOCX or PDF</p>
    </div>
  </div>

  <div class="body">
    <button class="btn btn-docx" id="btnDocx">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 2a1 1 0 011-1h5.5L12 4.5V12a1 1 0 01-1 1H3a1 1 0 01-1-1V2z" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M8 1v3.5H12" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.5 8h5M4.5 10.5h3" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      Download DOCX
    </button>

    <button class="btn btn-pdf" id="btnPdf">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 2a1 1 0 011-1h5.5L12 4.5V12a1 1 0 01-1 1H3a1 1 0 01-1-1V2z" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M8 1v3.5H12" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 7.5h2.5c.8 0 1.5.7 1.5 1.5S7.3 10.5 6.5 10.5H4V7.5z" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/>
      </svg>
      Download PDF
    </button>

    <div id="status"></div>
  </div>

  <div class="footer">
    <span class="footer-hint">Ads &amp; sidebars removed automatically</span>
    <a href="https://bobdoc.vercel.app" target="_blank" class="footer-link">bobdoc.vercel.app ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
