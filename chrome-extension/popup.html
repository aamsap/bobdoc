<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bobdoc</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      width: 300px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      flex-shrink: 0;
      display: block;
    }

    .header-text h1 {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.2px;
      line-height: 1;
    }

    .header-text p {
      font-size: 10.5px;
      color: #555;
      margin-top: 3px;
    }

    /* ── Options panel ── */
    .options {
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .option-label {
      font-size: 11px;
      color: #777;
      flex-shrink: 0;
    }

    .option-row select {
      font-size: 11px;
      background: #1a1a1a;
      color: #e0e0e0;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 5px;
      padding: 3px 6px;
      outline: none;
      cursor: pointer;
      flex: 1;
      max-width: 140px;
    }

    .option-row select:focus { border-color: rgba(255,255,255,0.25); }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 28px;
      height: 16px;
      flex-shrink: 0;
    }

    .toggle input { opacity: 0; width: 0; height: 0; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle input:checked + .toggle-track { background: #2563eb; }

    .toggle-track::after {
      content: '';
      position: absolute;
      left: 2px;
      top: 2px;
      width: 12px;
      height: 12px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-track::after { transform: translateX(12px); }

    /* ── Body ── */
    .body {
      padding: 12px 16px 14px;
    }

    /* ── Tab row ── */
    .tab-row {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
    }

    .tab {
      flex: 1;
      padding: 5px;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px;
      font-size: 11px;
      color: #777;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .tab.active {
      background: #222;
      color: #e0e0e0;
      border-color: rgba(255,255,255,0.18);
    }

    /* ── Preview box ── */
    .preview-box {
      display: none;
      background: #181818;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 7px;
      padding: 10px 12px;
      margin-bottom: 10px;
      max-height: 130px;
      overflow-y: auto;
      font-size: 11px;
      color: #aaa;
      line-height: 1.55;
    }

    .preview-box.visible { display: block; }

    .preview-box h1, .preview-box h2, .preview-box h3 {
      color: #e0e0e0;
      font-size: 11.5px;
      margin-bottom: 4px;
      margin-top: 6px;
    }

    .preview-box p { margin-bottom: 4px; }

    .preview-box::-webkit-scrollbar { width: 4px; }
    .preview-box::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 6px;
    }

    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 10px;
      border: none;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      letter-spacing: -0.1px;
    }

    .btn-docx { background: #2563eb; color: #fff; }
    .btn-pdf  { background: #16a34a; color: #fff; }
    .btn-md   { background: #7c3aed; color: #fff; }
    .btn-txt  { background: #374151; color: #fff; }

    .btn:hover:not(:disabled)  { filter: brightness(1.1); }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Status ── */
    #status {
      margin-top: 9px;
      font-size: 11px;
      color: #555;
      text-align: center;
      min-height: 14px;
      line-height: 1.4;
    }

    #status.error   { color: #f87171; }
    #status.success { color: #4ade80; }

    /* ── Footer ── */
    .footer {
      padding: 8px 16px 10px;
      border-top: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-hint { font-size: 10px; color: #3a3a3a; }

    .footer-link {
      font-size: 10px;
      color: #444;
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-link:hover { color: #777; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img src="icons/icon48.png" class="logo" alt="Bobdoc" />
    <div class="header-text">
      <h1>Bobdoc</h1>
      <p>Export this page as a clean document</p>
    </div>
  </div>

  <!-- Options -->
  <div class="options">
    <div class="option-row">
      <span class="option-label">Page size</span>
      <select id="optPageSize">
        <option value="A4">A4</option>
        <option value="Letter">US Letter</option>
      </select>
    </div>
    <div class="option-row">
      <span class="option-label">Font</span>
      <select id="optFont">
        <option value="sans">Sans-serif (Calibri)</option>
        <option value="serif">Serif (Georgia)</option>
        <option value="mono">Monospace (Courier)</option>
      </select>
    </div>
    <div class="option-row">
      <span class="option-label">Include images</span>
      <label class="toggle">
        <input type="checkbox" id="optImages" checked />
        <span class="toggle-track"></span>
      </label>
    </div>
    <div class="option-row">
      <span class="option-label">Selection only</span>
      <label class="toggle">
        <input type="checkbox" id="optSelection" />
        <span class="toggle-track"></span>
      </label>
    </div>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Preview tabs -->
    <div class="tab-row">
      <div class="tab active" id="tabExport">Export</div>
      <div class="tab" id="tabPreview">Preview</div>
    </div>

    <!-- Preview pane (hidden until Preview tab clicked) -->
    <div class="preview-box" id="previewBox">
      <em style="color:#444">Click Preview to see extracted content</em>
    </div>

    <!-- Export buttons -->
    <div class="btn-row" id="exportButtons">
      <button class="btn btn-docx" id="btnDocx">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 2a1 1 0 011-1h5.5L12 4.5V12a1 1 0 01-1 1H3a1 1 0 01-1-1V2z" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 1v3.5H12" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 8h5M4.5 10.5h3" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/></svg>
        DOCX
      </button>
      <button class="btn btn-pdf" id="btnPdf">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 2a1 1 0 011-1h5.5L12 4.5V12a1 1 0 01-1 1H3a1 1 0 01-1-1V2z" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 1v3.5H12" stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 7.5h2.5c.8 0 1.5.7 1.5 1.5S7.3 10.5 6.5 10.5H4V7.5z" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/></svg>
        PDF
      </button>
      <button class="btn btn-md" id="btnMd">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><rect x="1" y="3" width="12" height="8" rx="1.5" stroke="#fff" stroke-width="1.1"/><path d="M3.5 9V5l2 2.5L7.5 5v4M9 9V5.5l1.5 1.5" stroke="#fff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        MD
      </button>
      <button class="btn btn-txt" id="btnTxt">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M4 7h6M3 10h8" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>
        TXT
      </button>
    </div>

    <div id="status"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-hint">Ads &amp; sidebars removed automatically</span>
    <a href="https://bobdoc.vercel.app" target="_blank" class="footer-link">bobdoc.vercel.app ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
