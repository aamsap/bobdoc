name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Backend: lint + test ─────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (syntax check)
        run: node --check api/index.js api/pdf.js api/docx.js
        # --check parses the files for syntax errors; replace with
        # `npx eslint .` once an ESLint config is added.

      - name: Run unit tests
        run: npm test

      - name: Smoke-test health endpoint
        run: |
          node api/index.js &
          SERVER_PID=$!
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api)
          kill $SERVER_PID
          if [ "$STATUS" != "200" ]; then
            echo "Health check returned $STATUS"
            exit 1
          fi
          echo "Health check OK"

  # ── Extension: package into zip ──────────────────────────────────────────────
  package-extension:
    name: Package extension
    runs-on: ubuntu-latest
    needs: backend   # only package when backend passes

    steps:
      - uses: actions/checkout@v4

      - name: Build bobdoc-extension.zip
        run: |
          cd chrome-extension
          zip -r ../bobdoc-extension.zip . \
            --exclude "*.DS_Store" \
            --exclude "*.git*"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: bobdoc-extension
          path: bobdoc-extension.zip
          retention-days: 30
